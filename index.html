<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>部屋 VR</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- 部屋外側 -->
      <a-sky src="wallpaper.jpg"
        color="rgb(230, 230, 230)"
        material="repeat: 10 10; roughness: 0.85"
        ></a-sky>

      <!-- 部屋内側-->
      <a-box
        position="0 1.5 0"
        width="9"
        height="7"
        depth="8"
        src="wallpaper.jpg"
        color="rgb(230, 230, 230)"
        material="repeat: 10 10; roughness: 0.85"
      ></a-box>

      <!--床-->
      <a-plane
        position="0 0.01 0"
        rotation="-90 0 0"
        width="9"
        height="9"
        src="walnut_black.jpg"
        color="rgb(205, 205, 205)"
        material="repeat: 4 4; roughness: 0.85"
      ></a-plane>
      
       <!-- 窓枠 -->
       <a-plane
        position="-1 0 -3.9"
        rotation="0 0 0"
        width="4.4"
        height="8.6"
        color="rgb(154, 154, 154)"
        material="roughness: 0.95"
      ></a-plane>
      <!-- 窓 -->
       <a-plane
        position="-2.0 2.15 -3.8"
        rotation="0 0 0"
        width="2"
        height="4"
        color="rgb(225, 242, 245)"
        material="roughness: 0.95"
      ></a-plane>
       <a-plane
        position="0.05 2.15 -3.8"
        rotation="0 0 0"
        width="2"
        height="4"
        color="rgb(225, 242, 245)"
        material="roughness: 0.95"
      ></a-plane>
      
     <a-entity position="2.0 0 -2.5" rotation="0 -90 0" scale="2.0 2.5 2.5">
        <!-- 土台 -->
        <a-box
          position="0 0.15 0"
          width="1.2"
          height="0.3"
          depth="2.0"
          color="rgb(155, 118, 82)"
          material="roughness: 0.85"
        ></a-box>

        <!-- マットレス -->
        <a-box
          position="0 0.37 0"
          width="1.12"
          height="0.14"
          depth="1.92"
          color="rgb(242, 238, 232)"
          material="roughness: 0.95"
        ></a-box>

        <!-- 掛け布団 -->
        <a-box
          position="0 0.45 0.25"
          width="1.16"
          height="0.06"
          depth="1.35"
          color="rgb(210, 196, 178)"
          material="roughness: 0.9"
        ></a-box>

        <!-- 枕　-->
        <a-box
          position="0 0.48 -0.72"
          width="0.65"
          height="0.1"
          depth="0.38"
          color="rgb(248, 246, 242)"
          material="roughness: 0.95"
        ></a-box>

        <!-- ヘッドボード -->
        <a-box
          position="0 0.55 -0.96"
          width="1.24"
          height="0.8"
          depth="0.08"
          color="rgb(145, 108, 74)"
          material="roughness: 0.85"
        ></a-box>
      </a-entity>
      <!-- 本棚全体 -->
      <a-entity
        position="-4 0 -3.0"
        rotation="0 90 0"
        scale="1.3 1.2 3.0"
      >
        <!-- 左側板 -->
        <a-box
          position="-0.485 0.9 0"
          width="0.03"
          height="1.8"
          depth="0.32"
          color="rgb(140, 102, 68)"
          material="roughness: 0.85"
        ></a-box>

        <!-- 右側板 -->
        <a-box
          position="0.485 0.9 0"
          width="0.03"
          height="1.8"
          depth="0.32"
          color="rgb(140, 102, 68)"
          material="roughness: 0.85"
        ></a-box>

        <!-- 背板 -->
        <a-box
          position="0 0.9 -0.15"
          width="1.0"
          height="1.8"
          depth="0.015"
          color="rgb(125, 90, 58)"
          material="roughness: 0.9"
        ></a-box>

        <!-- 一番下の板 -->
        <a-box
          position="0 0.08 0"
          width="0.94"
          height="0.03"
          depth="0.3"
          color="rgb(152, 112, 75)"
          material="roughness: 0.85"
        ></a-box>

        <!-- 中段の板 -->
        <a-box
          position="0 0.65 0"
          width="0.94"
          height="0.03"
          depth="0.3"
          color="rgb(152, 112, 75)"
          material="roughness: 0.85"
        ></a-box>

        <!-- 上段板 -->
        <a-box
          position="0 1.22 0"
          width="0.94"
          height="0.03"
          depth="0.3"
          color="rgb(152, 112, 75)"
          material="roughness: 0.85"
        ></a-box>

        <!-- 一番上板 -->
        <a-box
          position="0 1.785 0"
          width="1.0"
          height="0.03"
          depth="0.32"
          color="rgb(152, 112, 75)"
          material="roughness: 0.85"
        ></a-box>
      </a-entity>
<!-- 本棚全体 -->
      <a-entity
        position="-4 0 -1.7"
        rotation="0 90 0"
        scale="1.3 1.2 3.0"
      >
        <!-- 左側板 -->
        <a-box
          position="-0.485 0.9 0"
          width="0.03"
          height="1.8"
          depth="0.32"
          color="rgb(140, 102, 68)"
          material="roughness: 0.85"
        ></a-box>

        <!-- 右側板 -->
        <a-box
          position="0.485 0.9 0"
          width="0.03"
          height="1.8"
          depth="0.32"
          color="rgb(140, 102, 68)"
          material="roughness: 0.85"
        ></a-box>

        <!-- 背板 -->
        <a-box
          position="0 0.9 -0.15"
          width="1.0"
          height="1.8"
          depth="0.015"
          color="rgb(125, 90, 58)"
          material="roughness: 0.9"
        ></a-box>
        <a-box
          position="0 0.08 0"
          width="0.94"
          height="0.03"
          depth="0.3"
          color="rgb(152, 112, 75)"
          material="roughness: 0.85"
        ></a-box>

        <!-- 中段の棚板 -->
        <a-box
          position="0 0.65 0"
          width="0.94"
          height="0.03"
          depth="0.3"
          color="rgb(152, 112, 75)"
          material="roughness: 0.85"
        ></a-box>

        <!-- 上段の棚板 -->
        <a-box
          position="0 1.22 0"
          width="0.94"
          height="0.03"
          depth="0.3"
          color="rgb(152, 112, 75)"
          material="roughness: 0.85"
        ></a-box>

        <!-- 一番上の天板 -->
        <a-box
          position="0 1.785 0"
          width="1.0"
          height="0.03"
          depth="0.32"
          color="rgb(152, 112, 75)"
          material="roughness: 0.85"
        ></a-box>
      </a-entity>
      <!-- テレビ・テレビ台 -->
      <a-entity
        position="-4.0 0 1.6"
        rotation="0 90 0"
        scale="2.0 2.0 2.0"
      >
        <!-- テレビ台本体 -->
        <a-box
          position="0 0.2 0"
          width="1.4"
          height="0.4"
          depth="0.42"
          color="rgb(40, 40, 40)"
          material="roughness: 0.9"
        ></a-box>

        <!-- テレビのスタンド -->
        <a-box
          position="0 0.43 0"
          width="0.32"
          height="0.06"
          depth="0.2"
          color="rgb(70, 72, 76)"
          material="roughness: 0.7"
        ></a-box>

        <!-- テレビの枠 -->
        <a-box
          position="0 0.82 0"
          width="1.2"
          height="0.68"
          depth="0.05"
          color="rgb(45, 47, 50)"
          material="roughness: 0.75"
        ></a-box>

        <!-- テレビの画面 -->
        <a-box
          position="0 0.82 0.028"
          width="1.12"
          height="0.6"
          depth="0.01"
          color="rgb(95, 130, 165)"
          material="roughness: 0.4"
        ></a-box>
      </a-entity>
       <!-- テーブル -->
      <a-entity
        position="0 0 1.5"
        rotation="0 90 0"
        scale="2.0 1.0 3.0"
      >
        <!-- 天板 -->
        <a-box
          position="0 0.70 0"
          width="1.2"
          height="0.04"
          depth="0.7"
          color="rgb(165, 126, 88)"
          material="roughness: 0.85"
        ></a-box>

        <!-- 左手前の脚 -->
        <a-box
          position="-0.52 0.34 0.28"
          width="0.05"
          height="0.68"
          depth="0.05"
          color="rgb(140, 104, 70)"
          material="roughness: 0.9"
        ></a-box>

        <!-- 右手前の脚 -->
        <a-box
          position="0.52 0.34 0.28"
          width="0.05"
          height="0.68"
          depth="0.05"
          color="rgb(140, 104, 70)"
          material="roughness: 0.9"
        ></a-box>

        <!-- 左奥の脚 -->
        <a-box
          position="-0.52 0.34 -0.28"
          width="0.05"
          height="0.68"
          depth="0.05"
          color="rgb(140, 104, 70)"
          material="roughness: 0.9"
        ></a-box>

        <!-- 右奥の脚 -->
        <a-box
          position="0.52 0.34 -0.28"
          width="0.05"
          height="0.68"
          depth="0.05"
          color="rgb(140, 104, 70)"
          material="roughness: 0.9"
        ></a-box>
      </a-entity>

     

      <!-- 視点 -->
      <a-entity position="2.0 1.0 1.5">
        <a-camera></a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
